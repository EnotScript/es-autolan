name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle','**/gradle.properties','**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Build (refresh dependencies)
        run: ./gradlew --no-daemon clean build --refresh-dependencies --console=plain
        env:
          CI: true
